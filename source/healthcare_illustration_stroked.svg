      <rect x="-60" y="-24" width="120" height="48" rx="24" fill="none" stroke="#1E293B" stroke-width="3"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#1E293B" stroke-width="3"/>
      <rect x="-44" y="-14" width="22" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.7"/>
    </g>
    <g id="icons/heart" transform="translate(1065 215)">
      <circle cx="0" cy="0" r="72" fill="#DBEAFE"/>
      <path d="M0 38 C-58 0 -54 -46 -24 -46 C-10 -46 0 -36 0 -26 C0 -36 10 -46 24 -46 C54 -46 58 0 0 38 Z" fill="#F87171" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
