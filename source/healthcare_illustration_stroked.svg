      <path d="M694 636 L699 641 L707 631" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="724" y="630" width="130" height="12" rx="6" fill="#DBEAFE"/>
      <circle cx="700" cy="676" r="13" fill="#14B8A6"/>
      <path d="M694 676 L699 681 L707 671" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="724" y="670" width="100" height="12" rx="6" fill="#DBEAFE"/>
      <circle cx="700" cy="716" r="13" fill="#FFFFFF" stroke="#14B8A6" stroke-width="3"/>
      <rect x="724" y="710" width="140" height="12" rx="6" fill="#DBEAFE"/>
    </g>
  </g>

