    <g id="doctor/stethoscope">
      <path d="M446 380 C436 440 452 476 476 480 C500 476 508 440 496 380" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
      <path d="M476 480 C478 500 470 520 452 528" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="446" cy="534" r="14" fill="#14B8A6" stroke="#1E293B" stroke-width="3"/>
      <circle cx="446" cy="534" r="5" fill="#FFFFFF"/>
