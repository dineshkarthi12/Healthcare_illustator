      <path d="M0 -50 L42 -36 V-2 C42 28 22 46 0 56 C-22 46 -42 28 -42 -2 V-36 Z" fill="#14B8A6" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-18 2 L-5 16 L20 -14" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icons/syringe" transform="translate(1070 600) rotate(40)">
      <circle cx="0" cy="0" r="72" fill="#DBEAFE"/>
      <rect x="-5" y="-66" width="10" height="26" fill="#1E293B"/>
      <rect x="-20" y="-72" width="40" height="10" rx="5" fill="#1E293B"/>
      <rect x="-30" y="-44" width="60" height="9" rx="4.5" fill="#1E293B"/>
      <rect x="-16" y="-38" width="32" height="70" rx="6" fill="#FFFFFF"/>
      <rect x="-16" y="-6" width="32" height="38" rx="6" fill="#14B8A6"/>
      <rect x="-16" y="-38" width="32" height="70" rx="6" fill="none" stroke="#1E293B" stroke-width="3"/>
      <path d="M2 -26 H16 M2 -14 H16 M2 -2 H16 M2 10 H16" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
      <rect x="-7" y="32" width="14" height="12" rx="3" fill="#1E293B"/>
      <line x1="0" y1="44" x2="0" y2="70" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============ DECOR ============ -->
  <g id="decor">
    <path d="M272 120 V148 M258 134 H286" fill="none" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
    <path d="M930 112 V134 M919 123 H941" fill="none" stroke="#F87171" stroke-width="6" stroke-linecap="round"/>
    <path d="M1110 400 V424 M1098 412 H1122" fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
    <path d="M90 430 V452 M79 441 H101" fill="none" stroke="#F87171" stroke-width="6" stroke-linecap="round"/>
    <circle cx="360" cy="190" r="8" fill="#2563EB"/>
    <circle cx="830" cy="190" r="7" fill="#14B8A6"/>
    <circle cx="1140" cy="760" r="9" fill="#14B8A6"/>
    <circle cx="70" cy="780" r="8" fill="#2563EB"/>
    <circle cx="200" cy="420" r="6" fill="#14B8A6"/>
    <circle cx="1010" cy="420" r="6" fill="#F87171"/>
