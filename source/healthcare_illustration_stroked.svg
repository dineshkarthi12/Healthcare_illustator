      <path d="M587 183 H613 V202 H632 V228 H613 V247 H587 V228 H568 V202 H587 Z" fill="#14B8A6" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="building/body">
      <rect x="220" y="280" width="760" height="510" rx="48" fill="#DBEAFE" stroke="#1E293B" stroke-width="3"/>
      <rect x="220" y="280" width="760" height="40" rx="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g id="building/windows">
      <rect x="258" y="360" width="60" height="70" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
      <rect x="258" y="470" width="60" height="70" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
      <rect x="258" y="580" width="60" height="70" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
      <rect x="930" y="360" width="30" height="70" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
      <rect x="930" y="470" width="30" height="70" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
      <rect x="930" y="580" width="30" height="70" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g id="building/door">
      <path d="M570 790 V700 Q570 670 600 670 Q630 670 630 700 V790 Z" fill="#2563EB" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
      <line x1="600" y1="676" x2="600" y2="790" stroke="#1E293B" stroke-width="3"/>
    </g>
  </g>

  <!-- ============ CLIPBOARD ============ -->
  <g id="clipboard">
    <g id="clipboard/board">
      <rect x="640" y="310" width="280" height="470" rx="28" fill="#2563EB" stroke="#1E293B" stroke-width="3"/>
      <rect x="664" y="346" width="232" height="408" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g id="clipboard/clip">
      <rect x="725" y="288" width="110" height="50" rx="16" fill="#14B8A6" stroke="#1E293B" stroke-width="3"/>
      <circle cx="780" cy="304" r="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g id="clipboard/heart-rate">
      <rect x="686" y="372" width="188" height="130" rx="14" fill="#DBEAFE"/>
      <path d="M700 440 H734 L746 414 L760 472 L776 390 L792 458 L802 440 H860" fill="none" stroke="#F87171" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="860" cy="440" r="6" fill="#F87171"/>
    </g>
    <g id="clipboard/lines">
      <rect x="686" y="528" width="150" height="12" rx="6" fill="#DBEAFE"/>
      <rect x="686" y="556" width="188" height="12" rx="6" fill="#DBEAFE"/>
      <rect x="686" y="584" width="120" height="12" rx="6" fill="#DBEAFE"/>
    </g>
    <g id="clipboard/checklist">
