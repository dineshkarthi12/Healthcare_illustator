      <path d="M444 374 L470 436 L496 374 Z" fill="#14B8A6" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M440 374 L470 446 L448 470 L428 386 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M500 374 L470 446 L492 470 L512 386 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" stroke-linejoin="round"/>
      <line x1="470" y1="446" x2="470" y2="656" stroke="#1E293B" stroke-width="3"/>
      <circle cx="482" cy="500" r="4" fill="#1E293B"/>
      <circle cx="482" cy="560" r="4" fill="#1E293B"/>
      <rect x="418" y="566" width="44" height="38" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
