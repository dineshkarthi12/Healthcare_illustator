    <g id="doctor/arm-right">
      <path d="M546 404 L594 520 L652 478" fill="none" stroke="#1E293B" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M546 404 L594 520 L652 478" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="660" cy="472" r="18" fill="#F6C6A4" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g id="doctor/head">
      <circle cx="470" cy="300" r="52" fill="#F6C6A4" stroke="#1E293B" stroke-width="3"/>
      <circle cx="417" cy="306" r="10" fill="#F6C6A4" stroke="#1E293B" stroke-width="3"/>
      <circle cx="523" cy="306" r="10" fill="#F6C6A4" stroke="#1E293B" stroke-width="3"/>
    </g>
    <g id="doctor/hair">
      <path d="M416 300 Q414 244 470 242 Q526 244 524 300 Q508 272 478 266 Q474 282 446 288 Q428 292 416 300 Z" fill="#1E293B"/>
      <circle cx="470" cy="232" r="24" fill="#1E293B"/>
