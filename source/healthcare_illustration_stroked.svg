<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Healthcare illustration - doctor with clipboard</title>

  <!-- ============ GROUND SHADOW ============ -->
  <g id="shadow">
    <ellipse cx="620" cy="792" rx="480" ry="22" fill="#1E293B" fill-opacity="0.12"/>
  </g>

  <!-- ============ BUILDING ============ -->
  <g id="building">
    <g id="building/tower">
      <rect x="470" y="140" width="260" height="180" rx="36" fill="#DBEAFE" stroke="#1E293B" stroke-width="3"/>
